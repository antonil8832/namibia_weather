{
  "name": "Update Namibia weather",
  "on": {
    "schedule": [{ "cron": "7 4,10,13,17 * * *" }],
    "workflow_dispatch": {}
  },
  "permissions": { "contents": "write" },
  "concurrency": { "group": "weather-update", "cancel-in-progress": false },
  "jobs": {
    "update": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "actions/setup-python@v5", "with": { "python-version": "3.12", "cache": "pip" } },
        { "name": "Install dependencies", "run": "pip install -r requirements.txt" },
        { "name": "Fetch weather data", "run": "python scripts/fetch_weather.py" },
        { "name": "Build charts", "if": "always()", "run": "python scripts/make_charts.py" },
        {
          "name": "Commit and push",
          "if": "always()",
          "run": "git config user.name \"weather-bot\"\ngit config user.email \"weather-bot@users.noreply.github.com\"\ngit add data docs\nif git diff --cached --quiet; then\n  echo \"No changes to commit\"\nelse\n  git commit -m \"Weather update $(TZ=Africa/Windhoek date '+%Y-%m-%d %H:%M') Windhoek\"\n  git pull --rebase\n  git push\nfi\n"
        }
      ]
    }
  }
}
