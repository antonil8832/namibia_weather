name: Update Namibia weather

on:
  schedule:
    # Windhoek is UTC+2 all year: 06:07, 12:07, 15:07, 19:07 local time
    - cron: "7 4,10,13,17 * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: weather-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch weather data
        run: python scripts/fetch_weather.py

      - name: Build charts
        if: always()
        run: python scripts/make_charts.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weather update $(TZ=Africa/Windhoek date '+%Y-%m-%d %H:%M') Windhoek"
            git pull --rebase
            git push
          fi
